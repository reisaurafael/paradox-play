<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470">
<defs>
  <linearGradient id="sc-stone" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#4a4453"/><stop offset=".55" stop-color="#37323f"/><stop offset="1" stop-color="#272330"/>
  </linearGradient>
  <linearGradient id="sc-stoneD" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#37323f"/><stop offset="1" stop-color="#211d2a"/>
  </linearGradient>
  <radialGradient id="sc-void" cx="0.5" cy="0.3" r="1">
    <stop offset="0" stop-color="#241a2e"/><stop offset=".6" stop-color="#160f1e"/><stop offset="1" stop-color="#0b0710"/>
  </radialGradient>
  <radialGradient id="sc-candle" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffb45a" stop-opacity=".5"/><stop offset="1" stop-color="#ffb45a" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="sc-open"><rect x="52" y="60" width="256" height="352"/></clipPath>
</defs>

<!-- through: a stall we know NOTHING about -->
<g clip-path="url(#sc-open)">
  <rect x="52" y="60" width="256" height="352" fill="url(#sc-void)"/>
  <!-- the HOODED one, barely there -->
  <path d="M 128 412 L 130 300 Q 132 236 180 232 Q 228 236 232 302 L 234 412 Z" fill="#0d0913"/>
  <path d="M 150 288 Q 180 258 212 290 Q 206 252 180 250 Q 154 252 150 288 Z" fill="#050308"/>
  <!-- counter sill in the dark -->
  <path d="M 52 348 L 308 348 L 308 372 L 52 372 Z" fill="#3c2a18" stroke="#14100b" stroke-width="3"/>
  <path d="M 52 348 L 308 348 L 308 355 L 52 355 Z" fill="#fff" opacity=".06"/>
  <path d="M 52 372 L 308 372 L 308 412 L 52 412 Z" fill="#2a1c10" stroke="#14100b" stroke-width="3"/>
  <path d="M 128 374 L 127 410 M 232 374 L 233 410" stroke="#14100b" stroke-width="2" opacity=".6"/>
  <!-- a single candle lights the offered thing -->
  <ellipse cx="180" cy="330" rx="86" ry="60" fill="url(#sc-candle)"/>
  <g>
    <rect x="246" y="316" width="12" height="30" rx="3" fill="#e0d4b2" stroke="#4a3a1c" stroke-width="2"/>
    <ellipse cx="252" cy="314" rx="4" ry="6" fill="#ffcf7a"/>
    <path d="M 252 306 q 3 -6 0 -10" stroke="#ffcf7a" stroke-width="2" fill="none"/>
  </g>
  <!-- faint alien wares hanging, silhouettes only -->
  <path d="M 84 120 l 0 34 m -10 0 a 10 10 0 0 0 20 0 Z" fill="#0d0913" stroke="#0d0913" stroke-width="2.4"/>
  <path d="M 286 112 l -2 30 q -12 16 4 22 q 14 -4 8 -22 Z" fill="#0d0913"/>
</g>

<!-- purple-teal energy seam hugging the frame mouth -->
<g fill="none">
  <rect x="56" y="64" width="248" height="344" stroke="#8a6fc0" stroke-width="12" opacity=".14"/>
  <rect x="54" y="62" width="252" height="348" stroke="#b49ae8" stroke-width="5" opacity=".6"/>
  <rect x="52" y="60" width="256" height="352" stroke="#e6dcff" stroke-width="2"/>
</g>
<path d="M 96 412 q -4 16 4 26 q 7 -10 2 -26 Z" fill="#b49ae8" opacity=".7"/>
<path d="M 268 412 q -3 13 4 21 q 6 -8 1 -21 Z" fill="#b49ae8" opacity=".55"/>

<!-- rectangular megalith FRAME: rough picture-frame stones -->
<g stroke="#100d16" stroke-width="4">
  <path d="M 20 26 L 130 20 L 128 60 L 54 64 L 56 128 L 16 132 Z" fill="url(#sc-stone)"/>
  <path d="M 130 20 L 252 24 L 250 62 L 128 60 Z" fill="url(#sc-stoneD)"/>
  <path d="M 252 24 L 344 30 L 348 138 L 306 136 L 304 62 L 250 62 Z" fill="url(#sc-stone)"/>
  <path d="M 348 138 L 344 300 L 306 296 L 306 136 Z" fill="url(#sc-stoneD)"/>
  <path d="M 344 300 L 348 446 L 240 452 L 242 412 L 306 408 L 306 296 Z" fill="url(#sc-stone)"/>
  <path d="M 240 452 L 110 450 L 112 410 L 242 412 Z" fill="url(#sc-stoneD)"/>
  <path d="M 110 450 L 12 444 L 18 306 L 56 308 L 54 410 L 112 410 Z" fill="url(#sc-stone)"/>
  <path d="M 18 306 L 16 132 L 56 128 L 56 308 Z" fill="url(#sc-stoneD)"/>
</g>
<g stroke="#100d16" stroke-width="5" fill="none" stroke-linecap="round">
  <path d="M 130 20 L 128 60 M 252 24 L 250 62 M 348 138 L 306 136 M 344 300 L 306 296"/>
  <path d="M 240 452 L 242 412 M 110 450 L 112 410 M 18 306 L 56 308 M 16 132 L 56 128"/>
</g>
<!-- (the faint violet runes were removed 27/09: purple writing the owner called unnecessary) -->
<!-- one brass fixture: the mystery has tech too -->
<circle cx="180" cy="40" r="9" fill="#221808" stroke="#100d16" stroke-width="2.6"/>
<circle cx="180" cy="40" r="5.5" fill="none" stroke="#a67e3c" stroke-width="2.2"/>
<circle cx="180" cy="40" r="2.6" fill="#b49ae8" opacity=".9"/>
</svg>
