<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
<defs>
  <linearGradient id="pt-stone" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0" stop-color="#636c7a"/><stop offset=".55" stop-color="#4a515e"/><stop offset="1" stop-color="#353b47"/>
  </linearGradient>
  <linearGradient id="pt-stoneD" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4a515e"/><stop offset="1" stop-color="#2b303a"/>
  </linearGradient>
  <linearGradient id="pt-brass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e8c473"/><stop offset=".5" stop-color="#a67e3c"/><stop offset="1" stop-color="#6a4e26"/>
  </linearGradient>
  <radialGradient id="pt-dusk" cx="0.5" cy="0.15" r="1.1">
    <stop offset="0" stop-color="#43304a"/><stop offset=".55" stop-color="#2e2136"/><stop offset="1" stop-color="#1d1524"/>
  </radialGradient>
  <radialGradient id="pt-lamp" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffd68a" stop-opacity=".4"/><stop offset="1" stop-color="#ffd68a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="pt-wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8a6540"/><stop offset="1" stop-color="#61462a"/>
  </linearGradient>
  <linearGradient id="pt-woodD" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#54401f"/><stop offset="1" stop-color="#38291a"/>
  </linearGradient>
  <linearGradient id="pt-paper" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d8cbb0"/><stop offset="1" stop-color="#b3a488"/>
  </linearGradient>
  <clipPath id="pt-opening">
    <path d="M 128 600 L 128 420 A 422 342 0 0 1 972 420 L 972 600 Z"/>
  </clipPath>
</defs>

