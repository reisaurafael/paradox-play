<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<defs>
  <linearGradient id="bc-navy" x1="0" y1="0" x2="0.15" y2="1">
    <stop offset="0%" stop-color="#2e5379"/><stop offset="50%" stop-color="#1f3a58"/><stop offset="100%" stop-color="#152a42"/>
  </linearGradient>
  <linearGradient id="bc-navyD" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1b334e"/><stop offset="100%" stop-color="#102238"/>
  </linearGradient>
  <linearGradient id="bc-velvet" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7a2b38"/><stop offset="60%" stop-color="#621f2b"/><stop offset="100%" stop-color="#4c1620"/>
  </linearGradient>
  <linearGradient id="bc-velvetD" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#521a26"/><stop offset="100%" stop-color="#3c1019"/>
  </linearGradient>
  <linearGradient id="bc-brass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e8c473"/><stop offset="45%" stop-color="#a67e3c"/><stop offset="100%" stop-color="#6a4e26"/>
  </linearGradient>
  <linearGradient id="bc-camel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8a6a44"/><stop offset="100%" stop-color="#5f4630"/>
  </linearGradient>
</defs>



<!-- ══════════ LID (open, standing) ══════════ -->
<g>
  <path d="M 112 26 L 688 26 Q 700 26 699 38 L 678 252 L 122 252 L 101 38 Q 100 26 112 26 Z"
        fill="url(#bc-navy)" stroke="#14100b" stroke-width="3.4"/>
  <path d="M 112 26 L 688 26 Q 700 26 699 38 L 698 48 L 102 48 L 101 38 Q 100 26 112 26 Z" fill="#ffffff" opacity="0.07"/>
  <!-- brass nameplate on the top border -->
  <rect x="336" y="27" width="128" height="20" rx="4" fill="url(#bc-brass)" stroke="#3a2a12" stroke-width="2"/>
  <text x="400" y="41" text-anchor="middle" font-family="Georgia,serif" font-weight="bold" font-size="11"
        letter-spacing="2.6" fill="#33240f">C.R.O.N.O.S.</text>
  <!-- velvet interior -->
  <path d="M 117 46 L 683 46 L 664 238 L 136 238 Z" fill="url(#bc-velvet)" stroke="#2a0c12" stroke-width="2.6"/>
  <path d="M 117 46 L 683 46 L 680 76 L 120 76 Z" fill="#ffffff" opacity="0.05"/>
  <path d="M 128 58 L 672 58 L 655 226 L 145 226 Z" fill="none" stroke="#caa06a" stroke-width="1.4"
        stroke-dasharray="5 4" opacity="0.45"/>

  <!-- CONTRACTS recess (left) -->
  <path d="M 142 72 L 384 72 L 376 212 L 152 212 Z" fill="url(#bc-velvetD)" stroke="#2a0c12" stroke-width="2.2"/>
  <path d="M 142 72 L 384 72 L 383 82 L 143 82 Z" fill="#000" opacity="0.32"/>
  <text x="264" y="206" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="2.5"
        fill="#caa06a" opacity="0.5">CONTRACTS</text>
  <path d="M 144 76 L 168 108 L 156 116 L 142 90 Z" fill="url(#bc-camel)" stroke="#14100b" stroke-width="2"/>
  <path d="M 382 76 L 358 108 L 370 116 L 384 90 Z" fill="url(#bc-camel)" stroke="#14100b" stroke-width="2"/>

  <!-- VOUCHERS recess (right) -->
  <path d="M 416 72 L 658 72 L 646 212 L 408 212 Z" fill="url(#bc-velvetD)" stroke="#2a0c12" stroke-width="2.2"/>
  <path d="M 416 72 L 658 72 L 657 82 L 417 82 Z" fill="#000" opacity="0.32"/>
  <text x="530" y="206" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="2.5"
        fill="#caa06a" opacity="0.5">VOUCHERS</text>
  <path d="M 419 112 L 652 110 M 414 158 L 648 156" stroke="#2a1a0c" stroke-width="7" opacity="0.85"/>
  <path d="M 419 112 L 652 110 M 414 158 L 648 156" stroke="#7a5330" stroke-width="2.4"/>

  <!-- lid brass corner caps -->
  <path d="M 112 26 L 148 26 L 142 58 L 104 56 L 101 38 Q 100 26 112 26 Z" fill="url(#bc-brass)" stroke="#3a2a12" stroke-width="2"/>
  <path d="M 688 26 L 652 26 L 658 58 L 696 56 L 699 38 Q 700 26 688 26 Z" fill="url(#bc-brass)" stroke="#3a2a12" stroke-width="2"/>
</g>

<!-- hinge gap -->
<path d="M 122 252 L 678 252 L 680 266 L 120 266 Z" fill="#0a1420" stroke="#14100b" stroke-width="2.4"/>
<circle cx="300" cy="259" r="3.2" fill="#8b959d" stroke="#14100b" stroke-width="1.3"/>
<circle cx="500" cy="259" r="3.2" fill="#8b959d" stroke="#14100b" stroke-width="1.3"/>

<!-- ══════════ BASE ══════════ -->
<g>
  <path d="M 120 266 L 680 266 L 702 400 Q 704 412 692 412 L 108 412 Q 96 412 98 400 Z"
        fill="url(#bc-navy)" stroke="#14100b" stroke-width="3.4"/>
  <!-- velvet floor -->
  <path d="M 136 280 L 664 280 L 682 398 L 118 398 Z" fill="url(#bc-velvet)" stroke="#2a0c12" stroke-width="2.6"/>
  <path d="M 136 280 L 664 280 L 666 294 L 134 294 Z" fill="#000" opacity="0.25"/>

  <!-- COIN TRAY (left) -->
  <path d="M 132 300 L 316 300 L 324 384 L 118 384 Z" fill="url(#bc-velvetD)" stroke="#2a0c12" stroke-width="2.2"/>
  <path d="M 132 300 L 316 300 L 317 309 L 131 309 Z" fill="#000" opacity="0.32"/>
  <g transform="translate(222 342)" stroke="#3c1019" stroke-width="3" fill="none" opacity="0.9">
    <circle r="24"/><circle r="11"/>
    <path d="M 0 -30 V -25 M 0 30 V 25 M -30 0 H -25 M 30 0 H 25 M -21 -21 l 3.4 3.4 M 21 21 l -3.4 -3.4 M 21 -21 l -3.4 3.4 M -21 21 l 3.4 -3.4"/>
    <path d="M 0 0 L 9 -2.6"/>
  </g>
  <text x="221" y="379" text-anchor="middle" font-family="monospace" font-size="9" letter-spacing="2.4"
        fill="#caa06a" opacity="0.5">GOLD RESERVE</text>

  <!-- CARDS compartment (right) -->
  <path d="M 344 300 L 662 300 L 678 384 L 354 384 Z" fill="url(#bc-velvetD)" stroke="#2a0c12" stroke-width="2.2"/>
  <path d="M 344 300 L 662 300 L 663 309 L 345 309 Z" fill="#000" opacity="0.32"/>
  <text x="514" y="379" text-anchor="middle" font-family="monospace" font-size="9" letter-spacing="2.4"
        fill="#caa06a" opacity="0.5">EQUIPMENT</text>

  <!-- base brass corner caps -->
  <path d="M 108 412 Q 96 412 98 400 L 103 368 L 140 372 L 134 412 Z" fill="url(#bc-brass)" stroke="#3a2a12" stroke-width="2"/>
  <path d="M 692 412 Q 704 412 702 400 L 697 368 L 660 372 L 666 412 Z" fill="url(#bc-brass)" stroke="#3a2a12" stroke-width="2"/>
</g>

<!-- ══════════ FRONT WALL ══════════ -->
<g>
  <path d="M 108 412 L 692 412 L 690 446 Q 689 456 677 456 L 123 456 Q 111 456 110 446 Z"
        fill="url(#bc-navyD)" stroke="#14100b" stroke-width="3"/>
  <path d="M 108 412 L 692 412 L 691.5 420 L 108.5 420 Z" fill="#ffffff" opacity="0.06"/>
  <g stroke="#3a2a12" stroke-width="2">
    <rect x="196" y="418" width="50" height="24" rx="4" fill="url(#bc-brass)"/>
    <rect x="208" y="424" width="26" height="7" rx="2" fill="#6a4e26"/>
    <rect x="554" y="418" width="50" height="24" rx="4" fill="url(#bc-brass)"/>
    <rect x="566" y="424" width="26" height="7" rx="2" fill="#6a4e26"/>
  </g>
</g>

<!-- handle -->
<path d="M 344 456 Q 342 488 400 488 Q 458 488 456 456 L 438 456 Q 439 474 400 474 Q 361 474 362 456 Z"
      fill="url(#bc-camel)" stroke="#14100b" stroke-width="3"/>
</svg>
